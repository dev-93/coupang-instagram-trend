name: Daily shopping trends

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8,18 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: read

concurrency:
  group: shopping-trends-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check required secrets
        run: |
          test -n "$NAVER_CLIENT_ID"
          test -n "$NAVER_CLIENT_SECRET"
          test -n "$NOTION_TOKEN"
      - run: npm run check
      - run: npm test
      - run: npm run daily
